// ---------- books store (per account: lives in the site's synced storage) ----------
let store = lsGet(BK, null) || { cur: null, books: {} };

  const ov = el('div', 'busy', '<div><span id="bmsg">Preparing your PDF…</span><div class="bar"><i id="bbar"></i></div></div>'); document.body.appendChild(ov);
  const host = el('div'); host.style.cssText = 'position:fixed;left:-12000px;top:0;'; document.body.appendChild(host);
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const pages = outPages(fmt, cover), imgs = []; let fontCSS = null;
    for (let i = 0; i < pages.length; i++) {
      $('#bmsg', ov).textContent = 'Rendering page ' + (i + 1) + ' of ' + pages.length + '…'; $('#bbar', ov).style.width = Math.round((i / pages.length) * 100) + '%';
      if (!pages[i]) { imgs.push(null); continue; }
      host.innerHTML = ''; const p = outPage(pages[i]); host.appendChild(p);
      if (fontCSS == null) { try { fontCSS = await htmlToImage.getFontEmbedCSS(p); } catch (e) { fontCSS = ''; } }
      imgs.push(await htmlToImage.toJpeg(p, { quality: 0.93, pixelRatio: 2.5, backgroundColor: '#ffffff', fontEmbedCSS: fontCSS, width: Math.round(210 * 96 / 25.4), height: Math.round(297 * 96 / 25.4) }));
    }
    const { jsPDF } = window.jspdf; let doc;
    if (fmt === 'a4') { doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }); imgs.forEach((im, i) => { if (i) doc.addPage('a4', 'portrait'); doc.addImage(im, 'JPEG', 0, 0, 210, 297, undefined, 'FAST'); }); }
    else {
      doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape', compress: true }); let first = true;
      impose(imgs.length).forEach((sh) => [sh.front, sh.back].forEach((side) => {
        if (!first) doc.addPage('a4', 'landscape'); first = false;
        side.forEach((ix, k) => { if (imgs[ix]) doc.addImage(imgs[ix], 'JPEG', k * 148.5, 0, 148.5, 210, undefined, 'FAST'); });
        doc.setDrawColor(200, 192, 175); doc.setLineWidth(0.2); doc.line(148.5, 0, 148.5, 4); doc.line(148.5, 206, 148.5, 210);
      }));
    }
    $('#bbar', ov).style.width = '100%';
    doc.save(slug(B.title) + (fmt === 'booklet' ? '-A5-booklet' : '-A4') + '.pdf'); toast('PDF downloaded');
  } catch (e) { console.error(e); toast('Download failed — use Print and choose “Save as PDF” instead'); }
  finally { host.remove(); ov.remove(); }
}
function outputModal() {
  if (editing) stopEdit();
  let fmt = 'a4', cover = true; const host = $('#modalHost'); host.innerHTML = '';
  const sc = el('div', 'scrim'), m = el('div', 'modal'); m.style.maxWidth = '800px'; sc.appendChild(m); host.appendChild(sc);
  const close = () => (host.innerHTML = ''); sc.addEventListener('pointerdown', (e) => { if (e.target === sc) close(); });
  const draw = () => {
    const pages = outPages(fmt, cover), n = B.pages.length + (fmt === 'booklet' && cover ? 1 : 0), blanks = pages.length - n;
    const checks = runChecks(fmt); if (fmt === 'booklet' && blanks) checks.push({ sev: 'info', msg: blanks + ' blank page' + (blanks > 1 ? 's' : '') + ' will be added at the back — a folded booklet needs a multiple of 4 pages.' });
    const nAtt = checks.filter((c) => c.sev !== 'info').length, SEV = { err: ['#B0492F', '!'], warn: ['#C08A2D', '!'], info: ['#9A9082', 'i'] };
    const lab = (ix) => { const pg = pages[ix]; return !pg ? '–' : pg.cover ? 'C' : String(B.pages.indexOf(pg) + 1); };
    const sheets = fmt === 'booklet' ? impose(pages.length) : [];
    m.innerHTML = '<div class="mono-lb">Print &amp; download</div><h2>Print or download “' + esc(B.title) + '”</h2><p class="lede">Choose a format. We check your pages first so nothing gets cut off or comes out too small.</p>' +
      '<div class="out-grid"><div class="fmt' + (fmt === 'a4' ? ' on' : '') + '" data-f="a4"><div class="pic"><i style="width:34px;height:48px"></i></div><div><b>A4 pages</b><span>' + B.pages.length + ' page' + (B.pages.length > 1 ? 's' : '') + ', one per sheet, exactly as you see them.</span></div></div>' +
      '<div class="fmt' + (fmt === 'booklet' ? ' on' : '') + '" data-f="booklet"><div class="pic"><i style="width:60px;height:42px"><b style="position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #B7A98C"></b></i></div><div><b>A5 booklet</b><span>Two pages per side of A4, printed double-sided — fold in half into a pocket booklet.</span></div></div></div>' +
      (fmt === 'booklet' ? '<label class="chkline"><input type="checkbox" id="cov"' + (cover ? ' checked' : '') + '> Add a cover page with the title and contents</label>' +
        '<div class="steps"><b>' + pages.length + ' booklet pages on ' + sheets.length + ' sheet' + (sheets.length > 1 ? 's' : '') + ' of A4.</b><ol><li>Print <b>double-sided</b> and choose <b>“Flip on short edge”</b>, at 100% / actual size.</li><li>Keep the sheets in order, stack them, and fold the stack in half.</li><li>Staple twice along the fold if you like — page 1 is on the outside.</li></ol>' +
        '<div class="imp">' + sheets.slice(0, 4).map((sh, i) => '<div><div style="display:flex;gap:4px"><div><div class="sh">' + sh.front.map((x) => '<span>' + lab(x) + '</span>').join('') + '</div><div class="cap">' + (i + 1) + ' front</div></div><div><div class="sh">' + sh.back.map((x) => '<span>' + lab(x) + '</span>').join('') + '</div><div class="cap">' + (i + 1) + ' back</div></div></div></div>').join('') + (sheets.length > 4 ? '<div class="cap" style="align-self:center">+' + (sheets.length - 4) + ' more</div>' : '') + '</div></div>' : '') +
      '<div class="mono-lb" style="margin:18px 0 8px">Print checks</div>' +
      (checks.length ? '<div class="checks">' + checks.map((c, i) => '<div class="ck"><span class="sev" style="background:' + SEV[c.sev][0] + '">' + SEV[c.sev][1] + '</span><span>' + esc(c.msg) + '</span>' + (c.it ? '<span class="go" data-i="' + i + '">Show me</span>' : '') + '</div>').join('') + '</div>'
        : '<div class="checks"><div class="ck"><span class="sev" style="background:#5C7E51">✓</span><span>All clear — nothing off the page, overlapping or too small.</span></div></div>') +
      '<div class="foot"><span class="hint" style="margin-right:auto;padding:0;' + (nAtt ? '' : 'color:#5C7E51') + '">' + (nAtt ? nAtt + ' thing' + (nAtt > 1 ? 's' : '') + ' worth checking — you can still go ahead' : '✓ Ready to print') + '</span><button class="pill" id="cx">Cancel</button><button class="pill" id="dl">⤓ Download PDF</button><button class="pill tf" id="pr">⎙ Print</button></div>';
    m.querySelectorAll('.fmt').forEach((f) => (f.onclick = () => { fmt = f.dataset.f; draw(); }));
    const cv = $('#cov', m); if (cv) cv.onchange = () => { cover = cv.checked; draw(); };
    m.querySelectorAll('.go').forEach((g) => (g.onclick = () => { const c = checks[+g.dataset.i]; close(); goToItem(c.it); }));
    $('#cx', m).onclick = close; $('#pr', m).onclick = () => { close(); doPrint(fmt, cover); }; $('#dl', m).onclick = () => { close(); downloadPdf(fmt, cover); };
  };
  draw();
}

// ---------- auto-filled templates: content-sized boxes flowed down columns, continuing onto new pages ----------
function srcTopics(src) {
  return DATA.topics.map((t) => ({ t, groups: t.groups.map((g) => ({ g, eqs: g.eqs.map((e) => EQ[e.id]).filter((e) => !e.minor || src === 'star').filter((e) => src !== 'star' || isStarred(e)) })).filter((x) => x.eqs.length) })).filter((x) => x.groups.length);
}
function autoFill(tk, src) {
  const T = srcTopics(src); if (!T.length) return null;
  const cfg = ({ blank: { cols: 2, fs: 9.5 }, topic: { cols: 2, fs: 9.5, perTopic: true }, areas: { cols: 2, fs: 9, perArea: true, byTopic: true }, crib: { cols: 3, fs: 7.2, byTopic: true, dense: true }, notes: { cols: 1, fs: 9.5, perTopic: true, notes: true } })[tk] || { cols: 2, fs: 9.5 };
  const AC = { found: 'teal', pipe: 'indigo', comp: 'amber' }, CYC = ['teal', 'indigo', 'amber', 'green', 'violet', 'terra', 'rose', 'grey'];
  const items = [], top = M, bottom = PAGE_H - M - 5, gap = cfg.dense ? 2 : GAP, eqGap = cfg.dense ? 1.2 : 2;
  const colW = cfg.notes ? 118 : (PAGE_W - 2 * M - (cfg.cols - 1) * 4) / cfg.cols;
  const cols = cfg.notes ? [{ x: M, w: colW }] : Array.from({ length: cfg.cols }, (_, i) => ({ x: M + i * (colW + 4), w: colW }));
  let pi = -1, colY = [], c = 0, n = 0;
  const newPage = () => { pi++; colY = cols.map(() => top); c = 0; };
  const advance = () => { c++; if (c >= cols.length) newPage(); };
  const full = (it, w) => { it.w = w || PAGE_W - 2 * M; measureNew(it); const y = Math.max(...colY); Object.assign(it, { p: pi, x: M, y }); items.push(it); colY = colY.map(() => y + it.h + gap); c = 0; };
  const eqItem = (e) => ({ type: 'eq', ref: e.id, fs: cfg.fs, showLabel: true, showUnits: false, box: cfg.dense ? 'none' : 'soft' });
  const placeBox = (title, color, eqs) => {
    let rest = eqs.slice(), cont = false;
    while (rest.length) {
      const col = cols[c], innerW = col.w - 6, head = title ? (cfg.dense ? 6 : 7) : 3; let y = colY[c] + head; const used = [];
      for (const e of rest) {
        if (!e._m) { measureNew(e); if (e.w > innerW) { e.fs = Math.max(6.2, +(e.fs * innerW / e.w).toFixed(2)); measureNew(e); } e._m = 1; }
        if (y + e.h + 2 > bottom && (used.length || colY[c] > top)) break;
        used.push(e); y += e.h + eqGap;
      }
      if (!used.length) { advance(); continue; }
      const bx = { type: 'box', color, title: cont ? title + ' (cont.)' : title, p: pi, x: col.x, y: colY[c], w: col.w };
      let yy = colY[c] + head; used.forEach((e) => { Object.assign(e, { p: pi, x: col.x + 3, y: +yy.toFixed(2) }); yy += e.h + eqGap; items.push(e); n++; });
      bx.h = +(yy - eqGap + 2.5 - colY[c]).toFixed(2); items.push(bx); colY[c] += bx.h + gap;
      rest = rest.slice(used.length); cont = true; if (rest.length) advance();
    }
  };
  const sideNotes = (t) => { let y = colY[0]; [['When to spot it', t.spot], ['Assumptions', t.assume], ['Trigger words', t.triggers]].forEach(([h, txt]) => { if (!txt) return; const it = { type: 'text', style: 'callout', text: h + ': ' + txt, w: PAGE_W - 2 * M - colW - 5 }; measureNew(it); Object.assign(it, { p: pi, x: M + colW + 5, y }); items.push(it); y += it.h + 3; }); };
  if (!cfg.perTopic && !cfg.perArea) { newPage(); full({ type: 'text', style: cfg.dense ? 'subtitle' : 'title', text: cfg.dense ? 'Thermofluids — crib sheet' : 'Thermofluids formula book' }); }
  let lastArea = null;
  T.forEach(({ t, groups }) => {
    if (cfg.perArea && t.area !== lastArea) { newPage(); full({ type: 'text', style: 'title', text: AREA[t.area].name }); lastArea = t.area; }
    if (cfg.perTopic) { newPage(); full({ type: 'text', style: 'label', text: AREA[t.area].name + ' · Topic ' + t.num }); full({ type: 'text', style: 'title', text: t.name }); if (cfg.notes) sideNotes(t); }
    else if (!cfg.byTopic) full({ type: 'text', style: 'subtitle', text: t.num + '. ' + t.name, color: 'teal' });
    if (cfg.byTopic) placeBox(t.num + '. ' + t.name, AC[t.area], groups.flatMap((x) => x.eqs.map(eqItem)));
    else groups.forEach((x, gi) => placeBox((x.g.num ? x.g.num + ' ' : '') + x.g.title, CYC[gi % CYC.length], x.eqs.map(eqItem)));
  });
  items.forEach((i) => { delete i._m; if (!i.h) i.h = 6; });
  return { pages: pi + 1, items, cols: cfg.notes ? 0 : (cfg.cols === 3 ? 3 : 0), filled: n };
}

// ---------- toolbar & keys ----------
function setTool(t) { tool = t; canvas.className = 'canvas t-' + t; document.querySelectorAll('#tools button').forEach((b) => b.classList.toggle('on', b.dataset.t === t)); if (t !== 'sel') toast(t === 'text' ? 'Click on the page to type' : 'Drag on the page to draw a box'); }
function syncUI() { $('#bSnap').classList.toggle('on', B.snap); $('#bGrid').classList.toggle('on', B.grid); $('#zv').textContent = Math.round(B.zoom * 100) + '%'; $('#bookTitle').textContent = B.title || 'Untitled'; }
function fitZoom() { return Math.max(0.4, Math.min(1.1, +((canvas.clientWidth - 90) / (PAGE_W * 96 / 25.4)).toFixed(2))); }
const setZoom = (z) => { const sc = canvas.scrollTop / Math.max(1, canvas.scrollHeight); B.zoom = Math.max(0.35, Math.min(2.2, +z.toFixed(2))); render(); canvas.scrollTop = sc * canvas.scrollHeight; };
$('#tools').onclick = (e) => { const b = e.target.closest('button'); if (b) setTool(b.dataset.t); };
$('#bEq').onclick = () => eqModal();
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bSnap').onclick = () => { B.snap = !B.snap; render(); toast('Snapping ' + (B.snap ? 'on' : 'off')); };
$('#bGrid').onclick = () => { B.grid = !B.grid; render(); };
$('#bTidy').onclick = tidy;
$('#bZi').onclick = () => setZoom(B.zoom + 0.1); $('#bZo').onclick = () => setZoom(B.zoom - 0.1); $('#bFit').onclick = () => setZoom(fitZoom());
$('#bPrint').onclick = () => outputModal(); $('#bLib').onclick = () => $('.lib').classList.toggle('open');
$('#bookBtn').onclick = booksMenu;
$('#seg').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t; document.querySelectorAll('#seg button').forEach((x) => x.classList.toggle('on', x === b)); renderLib(); };
$('#q').oninput = (e) => { query = e.target.value.trim(); renderLib(); };
addEventListener('keydown', (e) => {
  if ($('#modalHost').children.length) return;
  const typing = e.target.closest && (e.target.closest('[contenteditable="true"]') || /INPUT|TEXTAREA/.test(e.target.tagName)), mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { if (typing) return; e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'p') { e.preventDefault(); outputModal(); return; }
  if (typing || !B) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
  if (!mod && e.key.toLowerCase() === 'v') return setTool('sel');
  if (!mod && e.key.toLowerCase() === 't') return setTool('text');
  if (!mod && e.key.toLowerCase() === 'b') return setTool('box');
  if (e.key === 'Escape') { setTool('sel'); sel.clear(); render(); return; }
  if (!sel.size) return;
  const items = B.items.filter((i) => sel.has(i.id));
  if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); act('del', items); }
  else if (e.key === 'Enter' && items.length === 1 && (items[0].type === 'text' || items[0].type === 'box')) { e.preventDefault(); startEdit(items[0].id); }
  else if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); snapshot(); const src = withContents(items); const cp = src.map((i) => Object.assign(JSON.parse(JSON.stringify(i)), { id: uid(), x: i.x + 5, y: i.y + 5 })); B.items.push(...cp); sel = new Set(cp.map((i) => i.id)); render(); }
  else if (mod && e.key.toLowerCase() === 'c') { window.__clip = JSON.parse(JSON.stringify(withContents(items))); toast('Copied ' + window.__clip.length); }
  else if (e.key.startsWith('Arrow')) { e.preventDefault(); snapshot(); const d = e.shiftKey ? 5 : 0.5; withContents(items).forEach((i) => { if (e.key === 'ArrowLeft') i.x -= d; if (e.key === 'ArrowRight') i.x += d; if (e.key === 'ArrowUp') i.y -= d; if (e.key === 'ArrowDown') i.y += d; }); render(); }
});
addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'v' && window.__clip && !$('#modalHost').children.length && !(e.target.closest && (e.target.closest('[contenteditable="true"]') || /INPUT/.test(e.target.tagName)))) { e.preventDefault(); snapshot(); const pid = currentPage(); const cp = window.__clip.map((i) => Object.assign(JSON.parse(JSON.stringify(i)), { id: uid(), page: pid, x: i.x + 5, y: i.y + 5 })); B.items.push(...cp); sel = new Set(cp.map((i) => i.id)); render(); } });
canvas.addEventListener('wheel', (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(B.zoom * (e.deltaY < 0 ? 1.06 : 0.94)); } }, { passive: false });
// follow the site's light / dark theme
try { if (parent !== window) new MutationObserver(() => document.documentElement.setAttribute('data-theme', parent.document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark')).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}

function boot() {
  if (!window.katex) return setTimeout(boot, 50);
  const id = store.books[store.cur] ? store.cur : Object.keys(store.books)[0];
  if (id) openBook(id); else newBookModal(true);
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot);
})();
